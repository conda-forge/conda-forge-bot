name: relock

on:
  workflow_dispatch: null
  issue_comment: null
  schedule:
    - cron: '14-59/15 * * * *'

concurrency: relock

jobs:
  relock-conda-forge-pinning:
    name: relock-conda-forge-pinning
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'issue_comment' }}
        with:
          token: ${{ secrets.AUTOTICK_BOT_GH_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: stop me if needed
        if: ${{ github.event_name == 'schedule' && github.event_name != 'issue_comment' }}
        run: |
          python autotick-bot/stop_me_if_needed.py

      - uses: conda-incubator/relock-conda@1d6a65e4f7caa9cb53573af00fa3e4f959cba572 # 2026.10.22
        if: ${{ (! env.CI_SKIP) && github.event_name != 'issue_comment' }}
        with:
          github-token: ${{ secrets.AUTOTICK_BOT_GH_TOKEN }}
          automerge: true
          skip-if-pr-exists: false
          git-user-name: regro-cf-autotick-bot
          update-packages: conda-forge-pinning
          merge-as-admin-packages: conda-forge-pinning
          head-branch: relock-conda-forge-pinning

  relock:
    name: relock
    needs: relock-conda-forge-pinning
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.AUTOTICK_BOT_GH_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: stop me if needed
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python autotick-bot/stop_me_if_needed.py

      - uses: conda-incubator/relock-conda@1d6a65e4f7caa9cb53573af00fa3e4f959cba572 # 2026.10.22
        if: ${{ ! env.CI_SKIP }}
        with:
          github-token: ${{ secrets.AUTOTICK_BOT_GH_TOKEN }}
          automerge: true
          skip-if-pr-exists: true
          git-user-name: regro-cf-autotick-bot
          ignored-packages: ${{ case(github.event_name != 'issue_comment', 'conda-forge-pinning', '') }}
