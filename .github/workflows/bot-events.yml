name: bot-events

run-name: 'event: ${{ inputs.event }} ${{ inputs.uid }}'

concurrency:
  group: 'event: ${{ inputs.event }} ${{ inputs.uid }}'
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      event:
        description: 'The github event.'
        required: true
        default: null
        type: choice
        options:
          - pr
          - push
      uid:
        description: 'The unique id of the event. For PRs, this is the PR number. For pushes, this is the feedstock name.'
        required: true
        type: string
      dry-run:
        description: 'Run the bot in `dry-run` mode, making no changes.'
        required: false
        default: false
        type: boolean

jobs:
  react-to-event:
    name: react-to-event
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: free disk space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"

      - name: get latest release
        id: latest_release
        run: |
          tag_name=$(gh api repos/conda-forge/conda-forge-bot/releases/latest --jq '.tag_name')
          echo "latest release: ${tag_name}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.latest_release.outputs.tag_name }}
          path: conda-forge-bot
          token: ${{ secrets.AUTOTICK_BOT_TOKEN }}

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: conda-forge-bot/conda-lock.yml
          environment-name: conda-forge-bot
          condarc-file: conda-forge-bot/autotick-bot/condarc

      - name: do local setup and stop me if needed
        run: |
          cd conda-forge-bot
          python autotick-bot/stop_me_if_needed.py

      - name: install bot code
        if: success() && ! env.CI_SKIP
        run: |
          source conda-forge-bot/autotick-bot/install_bot_code.sh \
            --no-clone-graph \
            --no-pull-container
        env:
          BOT_TOKEN: ${{ secrets.AUTOTICK_BOT_TOKEN }}
          BOT_APP_ID: ${{ secrets.CF_CURATOR_APP_ID }}
          BOT_PRIVATE_KEY: ${{ secrets.CF_CURATOR_PRIVATE_KEY }}

      - name: react to event
        if: success() && ! env.CI_SKIP
        run: |
          export RUN_URL="https://github.com/conda-forge/conda-forge-bot/actions/runs/${RUN_ID}"
          if [[ '${{ github.event.inputs.dry-run}}' == 'true' ]]; then
            kwargs="--debug --dry-run"
          else
            kwargs="--debug"
          fi

          pushd conda-forge-bot

          conda-forge-tick ${kwargs} \
            react-to-event \
            --event='${{ inputs.event }}' \
            --uid='${{ inputs.uid }}'

        env:
          BOT_TOKEN: ${{ secrets.AUTOTICK_BOT_TOKEN }}
          BOT_APP_ID: ${{ secrets.CF_CURATOR_APP_ID }}
          BOT_PRIVATE_KEY: ${{ secrets.CF_CURATOR_PRIVATE_KEY }}
          RUN_ID: ${{ github.run_id }}
          # emptied at the beginning and end of each run, used by Python tempdir
          TMPDIR: ${{ runner.temp }}
