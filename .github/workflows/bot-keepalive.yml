name: bot-keepalive

on:
  workflow_dispatch: null
  schedule:
    - cron: '0-59/15 * * * *'

concurrency: bot-keepalive

jobs:
  bot-keepalive:
    name: bot-keepalive
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: prevent multiple jobs running in parallel
        id: turnstyle
        uses: beckermr/turnstyle-python@3bb8204643f71a223e0447605958ef3ec5651038 # v3
        with:
          abort-after-seconds: 300
          poll-interval-seconds: 30
          github-token: ${{ secrets.AUTOTICK_BOT_GH_TOKEN }}
          workflow-name: bot-bot
        continue-on-error: true

      - name: debug outcome
        run: echo "outcome - ""${{ steps.turnstyle.outcome }}"

      - name: set CI_SKIP success
        if: steps.turnstyle.outcome == 'success'
        run: |
          echo "CI_SKIP=" >> $GITHUB_ENV

      - name: set CI_SKIP not success
        if: steps.turnstyle.outcome != 'success'
        run: |
          echo "CI_SKIP=1" >> $GITHUB_ENV

      - name: trigger the bot
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        if: github.ref == 'refs/heads/main' && ! cancelled() && ! failure() && ! env.CI_SKIP
        with:
          workflow: bot-bot
          ref: ${{ github.event.ref || github.head_ref || github.ref }}
          token: ${{ secrets.AUTOTICK_BOT_GH_TOKEN }}
