workflow_settings:
  store_build_artifacts: true
  free_disk_space: quick
  pagefile_size:
    - os: linux
      value: 8
    - os: win
      value: 16
  build_workspace_dir:
    - provider: azure
      os: win
      value: C:\bld
  tools_install_dir:
    - provider: azure
      os: win
      value: D:\miniforge3
  vm_image:
    - provider: azure
      os: linux
      value: ubuntu-22.04
    - provider: azure
      os: osx
      value: macos-14
    - provider: azure
      os: win
      value: windows-latest
docker:
  run_args: --cap-add SYS_ADMIN
